<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tính Tiền Thực Đơn</title>
</head>
<body>

    <form>
        <table border="1">
            <tr>
                <th colspan="3">THỰC ĐƠN</th>
            </tr>
            <tr>
                <th>Thức ăn</th>
                <th>Nước uống</th>
                <th>Thời điểm</th>
            </tr>
            <tr>
                <td valign="top">
                    <select id="thucAn" multiple size="7">
                        <option value="20000">Bún bò</option>
                        <option value="18000">Hủ tiếu</option>
                        <option value="17000">Bánh canh</option>
                        <option value="19000">Phở bò</option>
                        <option value="15000">Nuôi</option>
                        <option value="12000">Bánh mì thịt</option>
                        <option value="15000">Bánh cuốn</option>
                    </select>
                </td>
                <td valign="top">
                    <select id="nuocUong" multiple size="7">
                        <option value="12000">Cà phê đá</option>
                        <option value="15000">Cà phê sữa đá</option>
                        <option value="13000">Chanh dây</option>
                        <option value="12000">Chanh muối</option>
                        <option value="14000">Xí muội</option>
                        <option value="13000">Sữa tươi</option>
                        <option value="17000">Cam vắt</option>
                    </select>
                </td>
                <td valign="top">
                    <input type="radio" name="thoiDiem" id="banNgay" value="ngay" checked> Ban ngày<br><br>
                    <input type="radio" name="thoiDiem" id="banDem" value="dem"> Ban đêm
                </td>
            </tr>
            <tr>
                <td colspan="3" align="center">
                    <button type="button" onclick="tinhTien()">Tính tiền</button>
                </td>
            </tr>
        </table>
    </form>

    <br>

    <!-- Bảng chứa kết quả -->
    <table border="1" id="bangKetQua" width="400">
        <thead>
            <tr>
                <th>Các món đã dùng</th>
                <th>Tiền</th>
            </tr>
        </thead>
        <tbody id="danhSachMon">
            <!-- JavaScript sẽ chèn các dòng dữ liệu vào đây -->
        </tbody>
        <tfoot>
            <tr>
                <th>Tổng tiền</th>
                <th id="tongTien">0 đồng</th>
            </tr>
        </tfoot>
    </table>

    <script src="Scripts/script.js"></script>
</body>
</html>

    <body>
        <div style="border: 1px solid #ccc; padding: 20px; width: 300px;">

            <label for="firstNumber">1st Number :</label>
            <input type="number" id="firstNumber" value="12">

        <div class="input-group">
            <label for="secondNumber">2nd Number :</label>
            <input type="number" id="secondNumber" value="10">

        <div class="buttons">
            <button onclick="multiplyBy()">Multiply</button>
            <button onclick="divideBy()">Divide</button>
        </div>

        <div>
            <span>The Result Is :</span><br>
            <span id="result" style="font-weight: bold; font-size: 1.2em;"></span>
        </div>
    </div>

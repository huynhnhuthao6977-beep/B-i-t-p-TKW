<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Game - Tư Tưởng Hồ Chí Minh</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #8b1515;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #c49a45; text-transform: uppercase; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        
        .game-container {
            position: relative;
            width: 800px;
            height: 500px;
            margin-top: 20px;
            border: 5px solid #c49a45;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            /* Ảnh nền lịch sử khi mở hết mảnh ghép */
            background-image: url('https://media.baocaobang.vn/upload/image/202405/medium/119322_chu_tich_ho_chi_minh_doc_tuyen_ngon_doc_lap_anh_t_l_05340013.jpg');
            background-size: cover;
            background-position: center;
        }

        .puzzle-grid {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 2px;
        }

        .piece {
            background-color: #a32020;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            font-weight: bold;
            color: #c49a45;
            cursor: pointer;
            transition: all 0.5s ease;
            border: 1px solid #c49a45;
        }

        .piece:hover { background-color: #c42b2b; }
        .piece.hidden { opacity: 0; pointer-events: none; }

        /* Modal câu hỏi */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .modal-content {
            background: #fdf6e3;
            color: #2b2b2b;
            padding: 30px;
            border-radius: 10px;
            width: 500px;
            text-align: center;
            border: 3px solid #c49a45;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            padding: 10px;
            font-size: 16px;
            background: #8b1515;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }
        button:hover { background: #c49a45; color: #2b2b2b; }
        
        #victory-message {
            display: none;
            margin-top: 20px;
            color: #c49a45;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Lật Mảnh Ghép Lịch Sử</h1>
    <p>Trả lời đúng 4 câu hỏi để khám phá bức ảnh phía sau!</p>

    <div class="game-container">
        <div class="puzzle-grid" id="grid">
            <div class="piece" onclick="openQuestion(1)">1</div>
            <div class="piece" onclick="openQuestion(2)">2</div>
            <div class="piece" onclick="openQuestion(3)">3</div>
            <div class="piece" onclick="openQuestion(4)">4</div>
        </div>
    </div>
    
    <div id="victory-message">🎉 CHÚC MỪNG! BẠN ĐÃ MỞ KHÓA THÀNH CÔNG! 🎉</div>

    <div class="modal" id="questionModal">
        <div class="modal-content">
            <h2 id="q-text">Câu hỏi hiển thị ở đây</h2>
            <div class="options" id="options-container"></div>
        </div>
    </div>

    <script>
        const questions = {
            1: {
                q: "Theo Bác, mâu thuẫn lớn nhất ở các nước thuộc địa là gì?",
                opts: ["Công nhân với Tư sản", "Nông dân với Địa chủ", "Toàn thể dân tộc với Đế quốc"],
                ans: 2
            },
            2: {
                q: "Chân lý 'Không có gì quý hơn độc lập tự do' ra đời năm nào?",
                opts: ["1945", "1954", "1966"],
                ans: 2
            },
            3: {
                q: "Lực lượng nào giữ vai trò lãnh đạo cách mạng Việt Nam?",
                opts: ["Giai cấp tư sản", "Tầng lớp trí thức", "Đảng Cộng sản"],
                ans: 2
            },
            4: {
                q: "Đâu là 'sợi chỉ đỏ' xuyên suốt Cách mạng Việt Nam?",
                opts: ["Độc lập dân tộc gắn với CNXH", "Công nghiệp hóa đất nước", "Đấu tranh giai cấp"],
                ans: 0
            }
        };

        let currentPiece = null;
        let piecesSolved = 0;

        function openQuestion(id) {
            currentPiece = id;
            document.getElementById('q-text').innerText = questions[id].q;
            const optsContainer = document.getElementById('options-container');
            optsContainer.innerHTML = '';
            
            questions[id].opts.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index);
                optsContainer.appendChild(btn);
            });
            
            document.getElementById('questionModal').style.display = 'flex';
        }

        function checkAnswer(selectedIndex) {
            if (selectedIndex === questions[currentPiece].ans) {
                alert("Chính xác!");
                document.getElementById('questionModal').style.display = 'none';
                document.querySelectorAll('.piece')[currentPiece - 1].classList.add('hidden');
                piecesSolved++;
                
                if (piecesSolved === 4) {
                    setTimeout(() => {
                        document.getElementById('victory-message').style.display = 'block';
                    }, 500);
                }
            } else {
                alert("Sai rồi! Nhường cơ hội cho bạn khác nhé.");
                document.getElementById('questionModal').style.display = 'none';
            }
        }
    </script>
</body>
</html>
